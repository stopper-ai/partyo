function chooseTheme(t){party.theme=t;save();location.hash='create'}
function create(){return `<div class="breadcrumbs">Parti hazırlığı / 01 · Parti bilgileri</div><div class="page-title"><h1>Güzel bir gün planlayalım.</h1><p>Küçük detaylarla başlayın. İstediğiniz zaman değiştirebilirsiniz.</p></div><div class="two-col"><form id="party-form" class="panel"><h3>Kimi kutluyoruz?</h3><div class="form-grid"><div class="field"><label for="name">Doğum günü sahibinin adı</label><input id="name" name="name" value="${esc(party.name)}" required maxlength="40"></div><div class="field"><label for="age">Yeni yaşı</label><input id="age" name="age" type="number" min="1" max="120" value="${esc(party.age)}" required></div><div class="field"><label for="date">Parti tarihi</label><input id="date" name="date" type="date" value="${esc(party.date)}" required></div><div class="field"><label for="time">Başlangıç saati</label><input id="time" name="time" type="time" value="${esc(party.time)}" required></div><div class="field full"><label for="place">Nerede buluşuyoruz?</label><input id="place" name="place" value="${esc(party.place)}" required maxlength="100" placeholder="Mekân veya adres"></div><div class="field full"><label for="host">Davet eden</label><input id="host" name="host" value="${esc(party.host)}" required maxlength="60"></div></div><div class="notice"><span class="status local">Yerel taslak</span> Bu bilgiler yalnızca bu tarayıcıda saklanır.</div><div class="form-bottom"><a class="textbtn" href="#home">← Temalara dön</a><button class="btn" type="submit">Kaydet ve davetiyeye geç →</button></div></form><aside class="soft"><div class="eyebrow" style="text-align:center">PARTİNDEN İLK BAKIŞ</div><div id="live-card">${invitation()}</div><p class="preview-caption">Davetiyenizi bir sonraki adımda düzenleyebilirsiniz.</p></aside></div>`}
function invite(){return `<div class="breadcrumbs">Parti hazırlığı / 02 · Davetiye</div><div class="page-title"><h1>Tam size göre bir davetiye.</h1><p>Birkaç kelime, sevdiğiniz bir renk. İşte bu kadar.</p></div><div class="two-col"><section class="panel"><h3>Davetiyeyi kişiselleştir</h3><div class="field-label">Renk paleti</div><div class="swatches">${[['coral','Coral konfeti'],['sun','Güneşli bir gün'],['blue','Mavi hayaller']].map(([t,n])=>`<button aria-label="${n}" aria-pressed="${party.theme===t}" class="swatch ${t} ${party.theme===t?'selected':''}" onclick="setTheme('${t}')"></button>`).join('')}</div><div class="field"><label for="invite-name">Karttaki isim</label><input id="invite-name" maxlength="40" value="${esc(party.name)}" oninput="editField('name',this.value)"></div><div class="field"><label for="message">Davet mesajınız</label><textarea id="message" maxlength="180" oninput="editField('message',this.value)">${esc(party.message)}</textarea><small>En fazla 180 karakter · Değişiklikler canlı görünür.</small></div><a class="textbtn" href="#create">Tarih ve yer bilgilerini düzenle →</a><div class="editor-section"><h3>Paylaşmadan önce bir göz atın</h3><p style="font-size:14px;margin-bottom:16px">Misafirinizin göreceği davetiyeyi ve katılım formunu deneyin.</p><a class="btn" href="#rsvp">Misafir görünümünü aç ↗</a><button class="btn secondary" style="margin-top:12px" onclick="printCard()">Yazdır / PDF kaydet</button></div><div class="notice"><span class="status local">Otomatik yerel kayıt</span><br>Paylaşım ve davet gönderimi bu önizlemede bağlı değil.</div><a class="textbtn" href="#dashboard">Parti paneline geç →</a></section><aside class="soft"><div id="live-card">${invitation()}</div><p class="preview-caption">Canlı önizleme · ${esc(party.name)} için hazırlandı</p></aside></div>`}
function setTheme(t){party.theme=t;save();render()}
function editField(k,v){party[k]=v;save();$('#live-card').innerHTML=invitation()}
function rsvp(){return `<div class="breadcrumbs"><a href="#invite">← Davetiyeye dön</a> / Misafir görünümü</div><div class="rsvp-layout"><aside class="soft">${invitation()}</aside><section><div class="eyebrow">DAVETLİSİNİZ</div><div class="page-title"><h1>Birlikte daha güzel.</h1><p>${esc(party.name)}’in doğum gününde sizi de aramızda görmek isteriz.</p></div><div id="rsvp-area"><form id="rsvp-form"><div class="field"><label for="guest">Adınız soyadınız</label><input id="guest" name="guest" required maxlength="70" placeholder="Örn. Ayşe Yılmaz"></div><span class="field-label">Bize katılabilecek misiniz?</span><div class="choices" role="group" aria-label="Katılım yanıtı">${[['yes','Geliyorum'],['maybe','Belki'],['no','Gelemiyorum']].map(([v,n])=>`<button type="button" data-choice="${v}" aria-pressed="${rsvpChoice===v}" class="choice ${rsvpChoice===v?'selected':''}" onclick="selectChoice('${v}')">${n}</button>`).join('')}</div><div class="form-grid" id="guest-counts" ${rsvpChoice==='no'?'hidden':''}><div class="field"><label for="adults">Yetişkin</label><input type="number" id="adults" name="adults" value="1" min="1" max="20" required></div><div class="field"><label for="children">Çocuk</label><input type="number" id="children" name="children" value="1" min="0" max="20" required></div></div><div class="field" style="margin-top:20px"><label for="guest-note">Küçük bir not (isteğe bağlı)</label><textarea id="guest-note" name="note" maxlength="200" placeholder="İletmek istediğiniz bir şey var mı?"></textarea></div><button class="btn" type="submit" style="width:100%">Deneme yanıtını kaydet</button><div class="notice"><span class="status demo">Demo katılım yanıtı</span><br>Yanıt yalnızca bu tarayıcıdaki parti paneline eklenir. Ev sahibine mesaj gönderilmez. Lütfen örnek bilgiler kullanın.</div></form></div></section></div>`}
function selectChoice(c){rsvpChoice=c;document.querySelectorAll('[data-choice]').forEach(b=>{b.classList.toggle('selected',b.dataset.choice===c);b.setAttribute('aria-pressed',b.dataset.choice===c)});$('#guest-counts').hidden=c==='no';$('#guest-counts').style.display=c==='no'?'none':''}
function dashboard(){let yes=responses.filter(r=>r.choice==='yes'),people=yes.reduce((a,r)=>a+r.adults+r.children,0);return `<div class="dash-head"><div class="page-title" style="margin:0"><div class="eyebrow">PARTİ PANELİM</div><h1>${esc(party.name)}, ${esc(party.age)} yaşında!</h1><p>${esc(dateText())} · ${esc(party.time)} · ${esc(party.place)}</p></div><a class="btn secondary" href="#invite">Davetiyeyi düzenle ↗</a></div><div class="stats"><div class="stat"><strong>${responses.length}</strong><span>Deneme yanıtı</span></div><div class="stat"><strong>${people}</strong><span>Gelecek kişi · demo</span></div><div class="stat"><strong>${[party.music,party.video,party.album].filter(Boolean).length} / 3</strong><span>Eklenen içerik bağlantısı</span></div></div><div class="tabs" role="tablist" aria-label="Panel bölümleri">${[['content','Parti içerikleri'],['guests','Katılım yanıtları'],['after','Partiden sonra']].map(([t,n])=>`<button role="tab" aria-selected="${dashTab===t}" class="${dashTab===t?'active':''}" onclick="setTab('${t}')">${n}${t==='guests'?' ('+responses.length+')':''}</button>`).join('')}</div><div role="tabpanel">${dashTab==='content'?contentCards():dashTab==='guests'?guestTable():afterCards()}</div><div class="notice"><span class="status local">Yalnızca bu tarayıcıda</span> Paneldeki değişiklikler yerel olarak saklanır. Gerçek davet gönderimi ve sunucuya kayıt bağlı değildir.</div>`}
function linkCard(kind,title,desc,icon,placeholder){return `<article class="content-card"><div class="icon" aria-hidden="true">${icon}</div><h3>${title}</h3><p>${desc}</p><span class="status local">Yerel bağlantı</span><form onsubmit="saveLink(event,'${kind}')" style="width:100%"><label for="${kind}-url" class="note">HTTPS bağlantısı</label><input id="${kind}-url" name="url" type="url" pattern="https://.*" placeholder="${placeholder}" value="${esc(party[kind])}"><button class="btn secondary small" type="submit">Bağlantıyı kaydet</button></form>${party[kind]?`<button class="textbtn" onclick="openLink('${kind}')">Bağlantıyı aç ↗</button>`:`<button class="textbtn" onclick="demoMedia('${kind}')">${kind==='album'?'Nasıl çalışır?':'Örnek akışı incele →'}</button>`}</article>`}
function contentCards(){return `<div class="content-grid">${linkCard('music','Partinin ritmi','Sevdiğiniz çalma listesini partiye ekleyin.','♫','https://…')}${linkCard('video','Bir kutlama videosu','Bir video bağlantısıyla güne küçük bir sürpriz katın.','▷','https://…')}<article class="content-card"><div class="icon" aria-hidden="true">↓</div><h3>Minik parti detayları</h3><p>İsimli karşılama afişi ve masa kartını seçtiğiniz temayla indirin.</p><span class="status local">Gerçek dosya · SVG</span><button class="btn secondary small" onclick="downloadArt('poster')">Karşılama afişini indir ↓</button><button class="textbtn" onclick="downloadArt('place')">Masa kartını indir ↓</button></article></div>`}
function guestTable(){return responses.length?`<div class="section-head"><p>Bu cihazda kaydedilen deneme yanıtları</p><a class="btn secondary small" href="#rsvp">+ Yanıtı dene</a></div><div class="table-wrap"><table><thead><tr><th>Misafir</th><th>Yanıt</th><th>Yetişkin / Çocuk</th><th>Not</th></tr></thead><tbody>${responses.map(r=>`<tr><td>${esc(r.name)}</td><td><span class="status ${r.choice==='yes'?'local':'demo'}">${{yes:'Geliyor',no:'Gelemiyor',maybe:'Belki'}[r.choice]}</span></td><td>${r.adults} / ${r.children}</td><td>${esc(r.note)||'·'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h3>İlk yanıtı birlikte deneyelim.</h3><p>Misafir formunda kaydettiğiniz demo yanıtı burada görünecek.</p><a class="btn" href="#rsvp">Katılım formunu dene →</a></div>`}
function afterCards(){return `<div class="content-grid"><article class="content-card"><div class="icon" aria-hidden="true">♡</div><h3>İyi ki geldiniz.</h3><p>Günün güzelliği küçük bir teşekkürle devam etsin. İsme özel teşekkür kartınız hazır.</p><span class="status local">Gerçek dosya · SVG</span><button class="btn secondary small" onclick="downloadArt('thanks')">Teşekkür kartını indir ↓</button></article>${linkCard('album','Anıları bir araya getirin','Google Photos, iCloud veya başka bir albümün paylaşım bağlantısını ekleyin.','↗','https://…')}<article class="content-card"><div class="icon" aria-hidden="true">✉</div><h3>Son bir güzel mesaj</h3><p>“Bu güzel günü bizimle paylaştığınız için teşekkür ederiz. İyi ki varsınız!”</p><span class="status demo">Gönderim bağlı değil</span><button class="btn secondary small" onclick="demoThanks()">Mesajı önizle</button></article></div>`}
function setTab(t){dashTab=t;render()}
function safeLink(v){try{return new URL(v).protocol==='https:'}catch(e){return false}}
function saveLink(e,k){e.preventDefault();let v=new FormData(e.target).get('url').trim();if(v&&!safeLink(v)){toast('https:// ile başlayan geçerli bir bağlantı girin.');return}party[k]=v;const ok=save();render();if(ok)toast(v?'Bağlantı bu tarayıcıya kaydedildi.':'Bağlantı kaldırıldı.')}
function openLink(k){if(safeLink(party[k]))window.open(party[k],'_blank','noopener,noreferrer')}
function demoMedia(k){if(k==='album')modal('Fotoğraf albümü bağlantısı','<p>Kendi albümünüzün paylaşım bağlantısını ekleyin. Kaydettiğiniz adres yeni sekmede açılır. PARTYO bu önizlemede fotoğraf yüklemez veya albüm oluşturmaz.</p>');else modal(k==='music'?'Partinin ritmi · Demo':'Kutlama videosu · Demo',k==='music'?'<p>Karşılama · Neşeli başlangıç<br>Oyun zamanı · Biraz hareket<br>Pasta zamanı · Dilek tut<br>Veda · Güzel bir kapanış</p><p>Bu bir içerik planı örneğidir, müzik oynatılmaz. Çalma listesi bağlantınızı panelden ekleyebilirsiniz.</p>':'<p>00:00 · “İyi ki doğdun!” açılışı<br>00:05 · Birlikte geçen güzel anlar<br>00:20 · Aileden doğum günü mesajı<br>00:30 · Yeni yaşa merhaba</p><p>Bu bir video senaryosu örneğidir. Video oluşturulmaz veya oynatılmaz; kendi videonuzun bağlantısını panelden ekleyebilirsiniz.</p>')}
function demoThanks(){modal('Teşekkür mesajı · Önizleme',`<p>Sevgili dostlarımız,</p><p>${esc(party.name)}’in ${esc(party.age)}. yaşını bizimle kutladığınız için çok teşekkür ederiz. Gülüşlerinizle bu günü daha da güzelleştirdiniz.</p><p>Sevgiyle,<br>${esc(party.host)}</p><div class="notice">Demo · Bu mesaj gönderilmedi.</div>`)}
function printCard(){$('#print-sheet').innerHTML=invitation();window.print()}
function downloadArt(type){let palettes={coral:['#f9ddd1','#b74035'],sun:['#ffe5a8','#826018'],blue:['#deebf5','#345a87']};let [bg,fg]=palettes[party.theme]||palettes.coral;let title=type==='thanks'?'İyi ki geldiniz!':type==='poster'?'Hoş geldiniz!':'Birlikte daha güzel';let subtitle=type==='thanks'?'Günümüzü güzelleştirdiğiniz için teşekkürler.':`${party.name}, ${party.age} yaşında!`;let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="148mm" height="210mm" viewBox="0 0 560 794"><rect width="560" height="794" fill="${bg}"/><rect x="24" y="24" width="512" height="746" rx="220" fill="none" stroke="${fg}" stroke-width="1"/><g text-anchor="middle" fill="${fg}"><text x="280" y="175" font-family="Arial" font-size="14" letter-spacing="5">BİRLİKTE KUTLAYALIM</text><text x="280" y="320" font-family="Georgia" font-size="46" font-style="italic">${esc(title)}</text><text x="280" y="410" font-family="Arial" font-size="${party.name.length>20?'18':'24'}">${esc(subtitle)}</text><text x="280" y="480" font-family="Arial" font-size="18">${esc(dateText())}</text><text x="280" y="650" font-family="Arial" font-size="14" letter-spacing="4">PARTYO</text></g></svg>`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));a.download=`PARTYO-${type}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);toast('SVG dosyası hazır. Tarayıcıda açıp yazdırabilirsiniz.')}
function render(){let route=location.hash.slice(1)||'home';if(!['home','create','invite','rsvp','dashboard'].includes(route))route='home';$('#app').innerHTML=({home,create,invite,rsvp,dashboard}[route])();document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===route);if(a.dataset.nav===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(route==='create'){$('#party-form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(!d.name.trim()||!d.place.trim()||!d.host.trim()){toast('Lütfen isim, yer ve davet eden alanlarını doldurun.');return}party={...party,...d,age:Number(d.age),created:true};let ok=save();location.hash='invite';if(ok)toast('Parti taslağı bu tarayıcıya kaydedildi.')};}if(route==='rsvp')$('#rsvp-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('guest').trim();if(!name){toast('Lütfen bir isim girin.');return}responses.push({name,choice:rsvpChoice,adults:rsvpChoice==='no'?0:Number(f.get('adults')),children:rsvpChoice==='no'?0:Number(f.get('children')),note:f.get('note').trim()});let ok=save();$('#rsvp-area').innerHTML=`<div class="success"><div class="check">✓</div><h2>Deneme yanıtınız alındı.</h2><p>${ok?'Yanıt bu tarayıcıdaki parti paneline kaydedildi.':'Tarayıcı kaydı kullanılamıyor. Yanıt yalnızca açık sayfada tutuluyor.'} Gerçek mesaj gönderilmedi.</p><a class="btn" href="#dashboard" onclick="dashTab='guests'">Panelde yanıtı gör →</a></div>`};document.title='PARTYO · '+({home:'Ana sayfa',create:'Parti oluştur',invite:'Davetiye',rsvp:'Katılım yanıtı',dashboard:'Parti panelim'}[route])}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'navigate_partyo_preview',title:'PARTYO ekranını aç',description:'Özel yerel önizlemede seçilen ekranı açar. Kayıt ya da gönderim yapmaz.',inputSchema:{type:'object',properties:{screen:{type:'string',enum:['home','create','invite','rsvp','dashboard']}},required:['screen'],additionalProperties:false},annotations:{readOnlyHint:false},execute:async({screen})=>{if(!['home','create','invite','rsvp','dashboard'].includes(screen))throw new Error('Geçersiz ekran');location.hash=screen;render();return{screen,mode:'local-preview'}}})).catch(()=>{})}catch(e){}}
</script></body></html>
